<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TripLog — 사진 위 다꾸 overlay 워크벤치 (v3)</title>
<style>
  @font-face { font-family: 'East Sea Dokdo'; src: url('fonts/EastSeaDokdo-Regular.ttf'); }
  @font-face { font-family: 'Nanum Pen Script'; src: url('fonts/NanumPenScript-Regular.ttf'); }
  @font-face { font-family: 'Dokdo'; src: url('fonts/Dokdo-Regular.ttf'); }
  @font-face { font-family: 'Stylish'; src: url('fonts/Stylish-Regular.ttf'); }
  * { box-sizing: border-box; }
  body { margin: 0; background: #14120e; color: #e6dcc9; font: 14px/1.5 -apple-system, sans-serif; }
  .wrap { display: flex; gap: 24px; padding: 24px; }
  .stage { position: relative; }
  #card, #ov { max-height: 80vh; border-radius: 8px; display: block; }
  #ov { position: absolute; left: 0; top: 0; pointer-events: none; }
  #card { box-shadow: 0 8px 40px rgba(0,0,0,.6); cursor: crosshair; }
  .panel { width: 330px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: #9b8e79; font-size: 12px; margin-bottom: 16px; }
  .group { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid #2a2620; }
  .group h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8a7d68; margin: 0 0 8px; }
  button { background: #2a2620; color: #e6dcc9; border: 1px solid #3a342b; border-radius: 7px; padding: 7px 11px; cursor: pointer; font-size: 13px; margin: 0 6px 6px 0; }
  button:hover { background: #353029; }
  button.on { background: #c9a96a; color: #1a1610; border-color: #c9a96a; font-weight: 600; }
  input { background: #221f1a; border: 1px solid #3a342b; border-radius: 6px; color: #e6dcc9; padding: 6px 9px; width: 100%; font-size: 13px; }
  .hint { color: #8a7d68; font-size: 12px; margin-top: 6px; }
  code { background: #221f1a; padding: 1px 5px; border-radius: 4px; color: #d8b878; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <canvas id="card"></canvas>
    <canvas id="ov"></canvas>
  </div>
  <div class="panel">
    <h1>사진 위 다꾸 overlay 워크벤치</h1>
    <div class="sub">기본은 <b>자동 주석</b>. 강조할 대상만 직접 추가합니다.</div>
    <div class="group"><h2>사진 (원본 비율 유지)</h2><div id="photos"></div>
      <div class="hint" id="aspect"></div></div>
    <div class="group">
      <h2>객체지정 (선택)</h2>
      <button data-mode="off" class="on">자동 보기</button>
      <button data-mode="circle">① 원형으로 지정</button>
      <button data-mode="click">② 클릭으로 지정</button>
      <div class="hint" id="modeHint">자동 주석을 봅니다. 강조가 필요하면 모드를 켜세요.</div>
      <div style="margin-top:10px"><input id="noteText" placeholder="추가할 문구 (비우면 자동)" /></div>
      <div style="margin-top:8px"><button id="undo">마지막 취소</button><button id="reset">처음으로</button></div>
    </div>
    <div class="group"><h2>표시</h2>
      <button id="tgOutline" class="on">접시 외곽선</button>
      <button id="tgArrow" class="on">화살표</button>
      <button id="tgDeco" class="on">장식</button></div>
    <div class="group"><h2>상태</h2><div class="hint" id="status">초기화 중…</div></div>
    <div class="hint">정적 서버 필요: <code>python3 -m http.server 8000</code> → <code>localhost:8000/workbench-overlay.html</code></div>
  </div>
</div>

<script type="module">
import { renderOverlay } from './render-overlay.mjs';
import { computeOccupancy } from './freespace.mjs';
import { layoutOverlay } from './overlay-place.mjs';
import { OVERLAY } from './overlay-data.mjs';

const makeCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return { canvas: c, ctx: c.getContext('2d', { willReadFrequently: true }) }; };
const cardCv = document.getElementById('card'), cardCtx = cardCv.getContext('2d');
const ovCv = document.getElementById('ov'), ovCtx = ovCv.getContext('2d');
const measureCtx = makeCanvas(20, 20).ctx;
const statusEl = document.getElementById('status'), modeHint = document.getElementById('modeHint');

let S = { name: 'IMG_9717', mode: 'off', photoImg: null, field: null, W: 0, H: 0, polys: {},
  data: null, show: { outline: true, arrow: true, deco: true } };
const NOTE_POOL = [['여기', '강추 ♡'], ['최애 ✦'], ['이거', '진짜 맛있어'], ['행복한', '한 입'], ['비주얼', '미쳤다']];
const DECO_POOL = ['heart', 'sparkle', 'star', 'smile'];
let addCount = 0;

async function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function preloadFonts() {
  const fams = ['East Sea Dokdo', 'Nanum Pen Script', 'Dokdo', 'Stylish'];
  await Promise.all(fams.flatMap(f => [document.fonts.load(`40px "${f}"`), document.fonts.load(`60px "${f}"`)]));
  await document.fonts.ready;
}
async function loadPolys(name) {
  try { const d = await (await fetch(`out/segments_${name}.json`)).json();
    return d.items.map((it) => ({ cx: it.cx_norm, cy: it.cy_norm, poly: it.poly_norm }));
  } catch { return []; }
}
async function loadPhoto(name) {
  S.name = name;
  S.photoImg = await loadImg(`images/${name}.jpg`);
  S.W = 1080; S.H = Math.round(1080 * S.photoImg.height / S.photoImg.width);
  for (const c of [cardCv, ovCv]) { c.width = S.W; c.height = S.H; }
  document.getElementById('aspect').textContent = `${S.photoImg.width}×${S.photoImg.height} 원본 → ${S.W}×${S.H} (비율 보존)`;
  let mask = null; try { mask = await loadImg(`out/foodmask_${name}.png`); } catch {}
  S.field = computeOccupancy(makeCanvas, S.photoImg, { gw: 54, aspect: S.H / S.W, maskImg: mask });
  S.polys = await loadPolys(name);
  S.data = structuredClone(OVERLAY[name]);
  addCount = 0; render();
}
function render() {
  // 객체 순서 고정 → 기존 주석은 그대로, 추가 객체만 새로 배치 (재배치 없음)
  const spec = layoutOverlay({ ctx: measureCtx, W: S.W, H: S.H, field: S.field, data: S.data, polys: S.polys });
  if (!S.show.outline) spec.outlines = [];
  if (!S.show.arrow) spec.arrows = [];
  if (!S.show.deco) spec.doodles = [];
  renderOverlay(cardCtx, spec, { photo: S.photoImg });
  ovCtx.clearRect(0, 0, S.W, S.H);
  statusEl.innerHTML = `객체 ${S.data.objects.length} · 주석 ${spec.notes.length} · 직접추가 ${addCount}`;
}
function addAnchor(cx, cy, r, circled) {
  const txt = document.getElementById('noteText').value.trim();
  const note = txt ? txt.split(/\s*\/\s*|\n/).slice(0, 3) : NOTE_POOL[addCount % NOTE_POOL.length];
  S.data.objects.push({ cx, cy, r, note, deco: DECO_POOL[addCount % DECO_POOL.length], outline: circled ? 'circle' : false });
  addCount++; render();
}
function toNorm(ev) { const r = cardCv.getBoundingClientRect(); return [(ev.clientX - r.left) / r.width, (ev.clientY - r.top) / r.height]; }

// 원형 드래그 + 라이브 프리뷰
let drag = null;
cardCv.addEventListener('mousedown', (e) => { if (S.mode !== 'circle') return; drag = toNorm(e); });
window.addEventListener('mousemove', (e) => {
  if (!drag) return;
  const [x, y] = toNorm(e); const rr = Math.hypot((x - drag[0]) * S.W, (y - drag[1]) * S.H);
  ovCtx.clearRect(0, 0, S.W, S.H);
  ovCtx.strokeStyle = 'rgba(120,210,160,.95)'; ovCtx.lineWidth = 3; ovCtx.setLineDash([6, 8]);
  ovCtx.beginPath(); ovCtx.arc(drag[0] * S.W, drag[1] * S.H, Math.max(40, rr), 0, 7); ovCtx.stroke(); ovCtx.setLineDash([]);
});
window.addEventListener('mouseup', (e) => {
  if (!drag) return;
  const [x, y] = toNorm(e); const r = Math.hypot((x - drag[0]) * S.W, (y - drag[1]) * S.H) / S.W;
  addAnchor(drag[0], drag[1], Math.max(0.05, r), true); drag = null;
});
cardCv.addEventListener('click', (e) => { if (S.mode !== 'click') return; const [x, y] = toNorm(e); addAnchor(x, y, 0.09, false); });

// UI
const photosEl = document.getElementById('photos');
['IMG_9717', 'IMG_8247', 'IMG_9800'].forEach((n, i) => {
  const b = document.createElement('button'); b.textContent = n; if (i === 0) b.classList.add('on');
  b.onclick = () => { [...photosEl.children].forEach(c => c.classList.remove('on')); b.classList.add('on'); loadPhoto(n); };
  photosEl.appendChild(b);
});
const HINTS = { off: '자동 주석을 봅니다. 강조가 필요하면 모드를 켜세요.',
  circle: '강조할 음식 위를 드래그해 원으로 지정 → 그 원 그대로 외곽선 + 흰펜 노트가 생깁니다.',
  click: '강조할 음식을 클릭 → 그 자리에 주석이 추가됩니다(외곽선 없음).' };
document.querySelectorAll('[data-mode]').forEach((b) => {
  b.onclick = () => { document.querySelectorAll('[data-mode]').forEach(c => c.classList.remove('on')); b.classList.add('on');
    S.mode = b.dataset.mode; modeHint.textContent = HINTS[S.mode]; cardCv.style.cursor = S.mode === 'off' ? 'default' : 'crosshair'; };
});
document.getElementById('undo').onclick = () => { if (addCount > 0) { S.data.objects.pop(); addCount--; render(); } };
document.getElementById('reset').onclick = () => { S.data = structuredClone(OVERLAY[S.name]); addCount = 0; render(); };
for (const [id, key] of [['tgOutline', 'outline'], ['tgArrow', 'arrow'], ['tgDeco', 'deco']])
  document.getElementById(id).onclick = (e) => { S.show[key] = !S.show[key]; e.target.classList.toggle('on', S.show[key]); render(); };

preloadFonts().then(() => loadPhoto('IMG_9717')).then(() => statusEl.textContent += ' · 준비 완료');
</script>
</body>
</html>
