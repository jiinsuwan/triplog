name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Sprint 0 골격: frontend build / backend test / backend build
# frontend/, backend/ 실제 코드 추가 후 각 job의 working-directory와 명령을 활성화한다.

jobs:
  frontend-build:
    name: Frontend Build (Vue)
    runs-on: ubuntu-latest
    if: false  # TODO: frontend/ 세팅 완료 시 활성화
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-test:
    name: Backend Test (Spring Boot)
    runs-on: ubuntu-latest
    if: false  # TODO: backend/ 세팅 완료 시 활성화
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - run: ./gradlew test

  backend-build:
    name: Backend Build (Spring Boot)
    runs-on: ubuntu-latest
    needs: backend-test
    if: false  # TODO: backend/ 세팅 완료 시 활성화
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - run: ./gradlew build -x test
