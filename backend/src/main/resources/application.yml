# TripLog 백엔드 공통 설정 (core)
# 비밀/환경값은 모두 .env(또는 환경변수)로 주입한다. 값 직접 커밋 금지. (architecture §8)
spring:
  application:
    name: triplog
  # 공용 RestClient 타임아웃 (Spring AI OpenAI 호출 포함) — GMS 무응답 시 무한 대기 방지.
  http:
    client:
      connect-timeout: 5s
      read-timeout: 60s
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/triplog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USER:triplog}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  # Spring AI — SSAFY GMS(OpenAI 호환) 텍스트 LLM (S3-CORE-02 #66). 키는 .env(SSAFY_GMS_KEY)로 주입.
  ai:
    # LLM 재시도 끔(max-attempts=1) — 5xx/timeout 시 동일 프롬프트 반복 호출로 GMS 크레딧이 중복
    # 소모되는 것을 막는다. 짧은 카드 문구라 재시도 이득이 작다. (값은 PR에서 상대와 합의 — 일시 5xx
    # 복원력을 두려면 2.)
    retry:
      max-attempts: 1
    model:
      # 텍스트 chat 만 쓴다. 안 쓰는 모델 자동설정(audio/embedding/image/moderation)은 항상 비활성화.
      # chat 도 기본 none(fail-closed) — 키 없는 환경(클론 직후·타 트랙)에서 OpenAI auto-config 가
      # 부팅 시 api-key 검증으로 컨텍스트를 깨뜨리는 것을 막는다. GMS 키가 있는 환경에서만
      # SPRING_AI_MODEL_CHAT=openai 로 opt-in 한다(.env.example). 호출 경로 격리는 SsafyGmsProvider.
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      base-url: https://gms.ssafy.io/gmsapi/api.openai.com
      api-key: ${SSAFY_GMS_KEY:}
      chat:
        options:
          model: gpt-4o-mini

# MyBatis: snake_case ↔ camelCase 자동 매핑 (architecture §2-1, N2)
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# SpringDoc OpenAPI (architecture N3)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# 사진 로컬 저장 경로 (architecture §8, log 트랙)
app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  password-reset:
    ttl: ${PASSWORD_RESET_TTL:20m}
    min-response-delay: ${PASSWORD_RESET_MIN_RESPONSE_DELAY:250ms}
    expose-demo-url: ${PASSWORD_RESET_EXPOSE_DEMO_URL:false}
    demo-base-url: ${PASSWORD_RESET_DEMO_BASE_URL:http://localhost:5173/reset-password}

# External API client defaults (S2-CORE-01).
external-api:
  connect-timeout: ${EXTERNAL_API_CONNECT_TIMEOUT:3s}
  read-timeout: ${EXTERNAL_API_READ_TIMEOUT:5s}
  max-attempts: ${EXTERNAL_API_MAX_ATTEMPTS:3}
  backoff: ${EXTERNAL_API_BACKOFF:200ms}

# JWT (auth 골격, architecture §7). secret은 반드시 env로 주입.
jwt:
  secret: ${JWT_SECRET:}
  access-token-validity-ms: 1800000      # 30분
  refresh-token-validity-ms: 1209600000  # 14일

---
# 테스트 프로파일: 로컬 MySQL의 테스트 전용 스키마 사용 (architecture §9-1)
# mapper(SQL) 테스트가 추가되는 Sprint부터 실제 연결. 현재 Sprint 0 테스트는 DB 불필요(웹 슬라이스).
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/triplog_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USER:triplog}
    password: ${DB_PASSWORD:}
  # 테스트·CI 는 GMS 키 없이 돈다 → OpenAI chat 자동설정 비활성화(실호출 차단 + 컨텍스트 보호).
  ai:
    model:
      chat: none
jwt:
  secret: ${JWT_SECRET:test-only-secret-please-override-in-real-env-0123456789abcdef}
app:
  password-reset:
    min-response-delay: 0ms
