name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Sprint 0 활성화: frontend build/test · backend test · backend build
# 백엔드 확정 스택 = Java 21 + Maven (architecture D1). DB 테스트용 MySQL service container 포함(§9-2).

jobs:
  pr-title:
    name: PR Title Convention
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $TITLE"
          if echo "$TITLE" | grep -qE '^\[S[0-9]+-(CORE|TRIP|LOG)-[0-9]+\] .+'; then
            echo "OK: issue-key 형식"; exit 0
          fi
          if echo "$TITLE" | grep -qE '^(feat|fix|chore|docs)(\(.+\))?: .+'; then
            echo "OK: conventional 형식"; exit 0
          fi
          echo "::error::PR 제목 규칙 위반 — '[S{n}-{TRACK}-{n}] 작업명' 또는 'feat|fix|chore|docs: 설명' 형식이어야 합니다 (conventions §3-1)."
          exit 1

  frontend-build:
    name: Frontend Build & Test (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  backend-test:
    name: Backend Test (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: triplog_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_URL: jdbc:mysql://localhost:3306/triplog_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - run: ./mvnw -B test

  backend-build:
    name: Backend Build (Spring Boot)
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - run: ./mvnw -B package -DskipTests
