<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TripLog 카드 편집기 (PoC)</title>
<!-- 손글씨 폰트: 배치 렌더러와 동일한 로컬 ttf -->
<style>
@font-face { font-family: 'Nanum Pen Script'; src: url('fonts/NanumPenScript-Regular.ttf'); }
@font-face { font-family: 'Gaegu'; src: url('fonts/Gaegu-Regular.ttf'); }
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Gaegu', system-ui, sans-serif; background: #14110d; color: #eee; height: 100vh; overflow: hidden; }
#app { display: flex; height: 100vh; width: 100vw; }
#stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; background: #0d0b08; }
#wrap { position: relative; box-shadow: 0 8px 40px rgba(0,0,0,.6); }
canvas { display: block; }
#overlay { position: absolute; inset: 0; pointer-events: none; }
aside { width: 360px; background: #1d1813; border-left: 1px solid #332b22; padding: 14px; overflow-y: auto; }
h1 { font-size: 18px; margin: 0 0 10px; color: #ffd27f; }
h2 { font-size: 14px; margin: 16px 0 6px; color: #ffb86b; border-bottom: 1px solid #332b22; padding-bottom: 4px; }
label { font-size: 12px; display: block; margin: 6px 0 2px; color: #bbb; }
input, select, textarea { width: 100%; background: #14110d; border: 1px solid #3a3026; color: #eee; padding: 5px 7px; border-radius: 5px; font-size: 13px; font-family: inherit; }
.row { display: flex; gap: 6px; }
.row > * { flex: 1; }
button { background: #3a2f22; color: #ffd27f; border: 1px solid #51422f; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; }
button:hover { background: #4a3c2b; }
button.primary { background: #c8841f; color: #1a1410; border-color: #c8841f; font-weight: bold; }
button.danger { background: #5a2424; color: #ffb0b0; border-color: #743; }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.btnrow button { flex: 1; min-width: 70px; }
.layer { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 5px; cursor: pointer; font-size: 12px; }
.layer:hover { background: #2a221a; }
.layer.sel { background: #3a2f22; outline: 1px solid #c8841f; }
.layer .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.muted { color: #888; font-size: 11px; }
.tag { display: inline-block; background: #2a221a; padding: 1px 6px; border-radius: 4px; font-size: 11px; color: #ffd27f; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="wrap" :style="{ width: dispW + 'px', height: dispH + 'px' }">
      <canvas ref="cv" :width="W" :height="H" :style="{ width: dispW + 'px', height: dispH + 'px' }"
        @mousedown="onDown" @mousemove="onMove" @mouseup="onUp" @mouseleave="onUp"></canvas>
      <svg id="overlay" :viewBox="`0 0 ${W} ${H}`">
        <rect v-if="selBox" :x="selBox.x" :y="selBox.y" :width="selBox.w" :height="selBox.h"
          fill="none" stroke="#3af" stroke-width="4" stroke-dasharray="12 8" />
      </svg>
    </div>
  </div>

  <aside>
    <h1>🗺️ TripLog 카드 편집기</h1>
    <div class="muted">render-core.mjs 공용 · 배치 PNG와 동일 렌더</div>

    <h2>카드 불러오기</h2>
    <select v-model="currentCard" @change="loadCard">
      <option v-for="c in cardList" :value="c">{{ c }}</option>
    </select>
    <div class="btnrow">
      <button @click="pickPhoto">사진 교체</button>
      <input ref="photoInput" type="file" accept="image/*" style="display:none" @change="onPhoto" />
      <button @click="exportPNG" class="primary">PNG 저장</button>
    </div>
    <div class="btnrow">
      <button @click="copyJSON">JSON 복사</button>
      <button @click="importJSON">JSON 불러오기</button>
    </div>

    <h2>요소 추가</h2>
    <div class="btnrow">
      <button @click="addCaption">+ 캡션</button>
      <button @click="addArrow">+ 화살표</button>
      <button @click="addCircle">+ 동그라미</button>
      <button @click="addSticker">+ 스티커</button>
    </div>

    <h2>레이어 ({{ layers.length }})</h2>
    <div v-for="L in layers" :key="L.key" class="layer" :class="{ sel: isSel(L) }" @click="select(L.ref, L.kind, L.idx)">
      <span>{{ L.icon }}</span>
      <span class="t">{{ L.label }}</span>
      <button @click.stop="toggleHide(L)" :title="L.ref._hidden ? '보이기' : '숨기기'">{{ L.ref._hidden ? '🙈' : '👁' }}</button>
    </div>

    <h2>선택 요소</h2>
    <div v-if="!sel" class="muted">캔버스에서 요소를 클릭하거나 레이어를 선택하세요.</div>

    <!-- 캡션 -->
    <div v-else-if="sel.kind === 'caption'">
      <span class="tag">캡션</span>
      <label>텍스트 (줄바꿈 가능)</label>
      <textarea rows="2" v-model="sel.ref.text" @input="render"></textarea>
      <div class="row">
        <div><label>X</label><input type="number" v-model.number="sel.ref.x" @input="render" /></div>
        <div><label>Y</label><input type="number" v-model.number="sel.ref.y" @input="render" /></div>
      </div>
      <div class="row">
        <div><label>크기</label><input type="number" v-model.number="sel.ref.size" @input="render" /></div>
        <div><label>폰트</label>
          <select v-model="sel.ref.font" @change="render">
            <option>Nanum Pen Script</option><option>Gaegu</option>
          </select>
        </div>
      </div>
      <label>색</label><input type="color" v-model="sel.ref.color" @input="render" />
      <label><input type="checkbox" style="width:auto" :checked="hasWave(sel.ref)" @change="toggleWave(sel.ref, $event)" /> 물결 밑줄</label>
      <button class="danger" @click="removeSel">삭제</button>
    </div>

    <!-- 화살표 -->
    <div v-else-if="sel.kind === 'arrow'">
      <span class="tag">화살표</span>
      <div class="row"><div><label>from X</label><input type="number" v-model.number="sel.ref.from[0]" @input="render" /></div>
        <div><label>from Y</label><input type="number" v-model.number="sel.ref.from[1]" @input="render" /></div></div>
      <div class="row"><div><label>to X</label><input type="number" v-model.number="sel.ref.to[0]" @input="render" /></div>
        <div><label>to Y</label><input type="number" v-model.number="sel.ref.to[1]" @input="render" /></div></div>
      <div class="row"><div><label>색</label><input type="color" v-model="sel.ref.color" @input="render" /></div>
        <div><label>굵기</label><input type="number" v-model.number="sel.ref.width" @input="render" /></div></div>
      <button class="danger" @click="removeSel">삭제</button>
    </div>

    <!-- 동그라미 -->
    <div v-else-if="sel.kind === 'circle'">
      <span class="tag">동그라미</span>
      <div class="row"><div><label>중심 X</label><input type="number" v-model.number="sel.ref.cx" @input="render" /></div>
        <div><label>중심 Y</label><input type="number" v-model.number="sel.ref.cy" @input="render" /></div></div>
      <div class="row"><div><label>반지름</label><input type="number" v-model.number="sel.ref.r" @input="render" /></div>
        <div><label>색</label><input type="color" v-model="sel.ref.color" @input="render" /></div></div>
      <button class="danger" @click="removeSel">삭제</button>
    </div>

    <!-- 스티커 -->
    <div v-else-if="sel.kind === 'sticker'">
      <span class="tag">스티커</span>
      <label>종류</label>
      <select v-model="sel.ref.id" @change="render">
        <option v-for="id in stickerIds" :value="id">{{ id }}</option>
      </select>
      <div class="row"><div><label>X</label><input type="number" v-model.number="sel.ref.x" @input="render" /></div>
        <div><label>Y</label><input type="number" v-model.number="sel.ref.y" @input="render" /></div></div>
      <div class="row"><div><label>회전°</label><input type="number" v-model.number="sel.ref.rotation" @input="render" /></div>
        <div><label>크기</label><input type="number" step="0.1" v-model.number="sel.ref.scale" @input="render" /></div></div>
      <button class="danger" @click="removeSel">삭제</button>
    </div>

    <!-- 사진 -->
    <div v-else-if="sel.kind === 'photo'">
      <span class="tag">사진</span>
      <div class="row"><div><label>X</label><input type="number" v-model.number="spec.photo.x" @input="render" /></div>
        <div><label>Y</label><input type="number" v-model.number="spec.photo.y" @input="render" /></div></div>
      <div class="row"><div><label>너비</label><input type="number" v-model.number="spec.photo.w" @input="render" /></div>
        <div><label>높이</label><input type="number" v-model.number="spec.photo.h" @input="render" /></div></div>
    </div>

    <!-- 정보박스 -->
    <div v-else-if="sel.kind === 'info'">
      <span class="tag">정보박스</span>
      <label>장소</label><input v-model="spec.info_box.place" @input="render" />
      <div class="row"><div><label>날짜</label><input v-model="spec.info_box.date" @input="render" /></div>
        <div><label>인원</label><input type="number" v-model.number="spec.info_box.people" @input="render" /></div></div>
      <label>해시태그 (쉼표 구분)</label>
      <input :value="(spec.hashtags||[]).join(', ')" @input="setHashtags($event)" />
    </div>

    <h2>배경</h2>
    <input type="color" v-model="spec.canvas.background" @input="render" />
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.min.js"></script>
<script type="module">
import { renderCard, STICKER_COLORS } from './render-core.mjs';
const { createApp, reactive, ref, computed, nextTick } = Vue;

const PHOTOS = ['IMG_9800', 'IMG_4663', 'IMG_9717', 'IMG_8247'];
const STYLES = ['minimal', 'rich', 'info', 'polaroid'];
const CARD_LIST = PHOTOS.flatMap(p => STYLES.map(s => `${p}_${s}`));

createApp({
  setup() {
    const W = 1080, H = 1920;
    const dispH = Math.min(window.innerHeight - 20, 880);
    const dispW = dispH * W / H;
    const cv = ref(null), photoInput = ref(null);
    const spec = reactive({ canvas: { width: W, height: H, background: '#1a1410' }, photo: { x: 0, y: 300, w: 1080, h: 1020 }, captions: [], arrows: [], object_circles: [], stickers: [], hashtags: [], info_box: { place: '', date: '', people: 1, x: 90, y: 1700 } });
    const sel = ref(null);
    const currentCard = ref(CARD_LIST[0]);
    const stickerIds = Object.keys(STICKER_COLORS);

    let photoImg = null, stickerImgs = {}, rc = null;

    async function loadStickers() {
      for (const [id, color] of Object.entries(STICKER_COLORS)) {
        const svg = await (await fetch(`out/stickers/${id}.svg`)).text();
        const img = new Image();
        img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg.replace(/currentColor/g, color))));
        await img.decode().catch(() => {});
        stickerImgs[id] = img;
      }
    }
    function loadPhoto(name) {
      return new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = `images/${name}.jpg`; });
    }

    function render() {
      if (!cv.value) return;
      if (!rc) rc = rough.canvas(cv.value);
      const ctx = cv.value.getContext('2d');
      // _hidden 요소는 임시 제거한 사본으로 렌더
      const view = JSON.parse(JSON.stringify(spec));
      for (const k of ['captions', 'arrows', 'object_circles', 'stickers']) view[k] = (spec[k] || []).filter(e => !e._hidden);
      renderCard(ctx, view, { photo: photoImg, stickers: stickerImgs, rough: rc });
    }

    async function loadCard() {
      const data = await (await fetch(`out/cards/${currentCard.value}.json`)).json();
      Object.assign(spec, { arrows: [], object_circles: [], stickers: [], captions: [], hashtags: [] }, data);
      const photoName = currentCard.value.split('_').slice(0, 2).join('_');
      photoImg = await loadPhoto(photoName);
      sel.value = null;
      await nextTick(); render();
    }

    // ---- 레이어 목록 ----
    const layers = computed(() => {
      const out = [];
      (spec.captions || []).forEach((r, i) => out.push({ kind: 'caption', ref: r, idx: i, icon: '✏️', label: r.text?.slice(0, 14) || '캡션', key: 'c' + i }));
      (spec.arrows || []).forEach((r, i) => out.push({ kind: 'arrow', ref: r, idx: i, icon: '➶', label: '화살표', key: 'a' + i }));
      (spec.object_circles || []).forEach((r, i) => out.push({ kind: 'circle', ref: r, idx: i, icon: '◯', label: '동그라미', key: 'o' + i }));
      (spec.stickers || []).forEach((r, i) => out.push({ kind: 'sticker', ref: r, idx: i, icon: '✨', label: r.id, key: 's' + i }));
      return out;
    });
    function isSel(L) { return sel.value && sel.value.ref === L.ref; }
    function select(ref_, kind, idx) { sel.value = { ref: ref_, kind, idx }; render(); }
    function toggleHide(L) { L.ref._hidden = !L.ref._hidden; render(); }

    // ---- 선택 박스 (오버레이) ----
    const selBox = computed(() => {
      if (!sel.value) return null;
      const r = sel.value.ref, k = sel.value.kind;
      if (k === 'sticker') { const s = (r.scale || 1) * 130; return { x: r.x - s / 2, y: r.y - s / 2, w: s, h: s }; }
      if (k === 'circle') return { x: r.cx - r.r, y: r.cy - r.r, w: r.r * 2, h: r.r * 2 };
      if (k === 'caption') { const sz = r.size || 48; const w = (r.text || '').split('\n').reduce((m, l) => Math.max(m, l.length), 0) * sz * 0.55; return { x: r.x, y: r.y - sz, w, h: (r.text || '').split('\n').length * sz * 1.22 }; }
      if (k === 'arrow') { const x = Math.min(r.from[0], r.to[0]), y = Math.min(r.from[1], r.to[1]); return { x, y, w: Math.abs(r.to[0] - r.from[0]) || 10, h: Math.abs(r.to[1] - r.from[1]) || 10 }; }
      if (k === 'photo') return { x: spec.photo.x, y: spec.photo.y, w: spec.photo.w, h: spec.photo.h };
      return null;
    });

    // ---- 히트테스트 + 드래그 ----
    let drag = null;
    function toCanvas(e) { const rect = cv.value.getBoundingClientRect(); return { x: (e.clientX - rect.left) * W / rect.width, y: (e.clientY - rect.top) * H / rect.height }; }
    function hit(p) {
      // 위에 그려진 것부터 (스티커 > 동그라미 > 화살표 > 캡션 > 정보 > 사진)
      for (let i = spec.stickers.length - 1; i >= 0; i--) { const s = spec.stickers[i]; const sz = (s.scale || 1) * 130 / 2; if (Math.abs(p.x - s.x) < sz && Math.abs(p.y - s.y) < sz) return { ref: s, kind: 'sticker', idx: i }; }
      for (let i = spec.object_circles.length - 1; i >= 0; i--) { const c = spec.object_circles[i]; if (Math.hypot(p.x - c.cx, p.y - c.cy) < c.r + 20) return { ref: c, kind: 'circle', idx: i }; }
      for (let i = spec.arrows.length - 1; i >= 0; i--) { const a = spec.arrows[i]; if (distToSeg(p, a.from, a.to) < 28) return { ref: a, kind: 'arrow', idx: i }; }
      for (let i = spec.captions.length - 1; i >= 0; i--) { const c = spec.captions[i]; const sz = c.size || 48; const w = (c.text || '').split('\n').reduce((m, l) => Math.max(m, l.length), 0) * sz * 0.55; const h = (c.text || '').split('\n').length * sz * 1.22; if (p.x > c.x - 10 && p.x < c.x + w + 10 && p.y > c.y - sz && p.y < c.y - sz + h + 10) return { ref: c, kind: 'caption', idx: i }; }
      if (spec.info_box && p.y > spec.info_box.y - 60 && p.y < spec.info_box.y + 70) return { ref: spec.info_box, kind: 'info', idx: 0 };
      if (spec.photo && p.x > spec.photo.x && p.x < spec.photo.x + spec.photo.w && p.y > spec.photo.y && p.y < spec.photo.y + spec.photo.h) return { ref: spec.photo, kind: 'photo', idx: 0 };
      return null;
    }
    function distToSeg(p, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1]; const L = dx * dx + dy * dy || 1; let t = ((p.x - a[0]) * dx + (p.y - a[1]) * dy) / L; t = Math.max(0, Math.min(1, t)); return Math.hypot(p.x - (a[0] + t * dx), p.y - (a[1] + t * dy)); }
    function onDown(e) { const p = toCanvas(e); const h = hit(p); if (h) { sel.value = h; drag = { start: p, h }; } else { sel.value = null; } render(); }
    function onMove(e) {
      if (!drag) return; const p = toCanvas(e); const dx = p.x - drag.start.x, dy = p.y - drag.start.y; drag.start = p; const { ref: r, kind } = drag.h;
      if (kind === 'sticker' || kind === 'caption' || kind === 'info') { r.x += dx; r.y += dy; }
      else if (kind === 'circle') { r.cx += dx; r.cy += dy; }
      else if (kind === 'arrow') { r.from[0] += dx; r.from[1] += dy; r.to[0] += dx; r.to[1] += dy; }
      else if (kind === 'photo') { r.x += dx; r.y += dy; }
      render();
    }
    function onUp() { drag = null; }

    // ---- 요소 추가/삭제 ----
    function addCaption() { spec.captions.push({ id: 'c' + Date.now(), text: '새 캡션', x: 120, y: 200, font: 'Nanum Pen Script', size: 72, color: '#fffaf0', annotations: [] }); select(spec.captions.at(-1), 'caption', spec.captions.length - 1); }
    function addArrow() { spec.arrows.push({ from: [200, 1000], to: [500, 700], color: '#ffd700', width: 6 }); select(spec.arrows.at(-1), 'arrow', spec.arrows.length - 1); }
    function addCircle() { spec.object_circles.push({ cx: 540, cy: 900, r: 180, color: '#ffffff' }); select(spec.object_circles.at(-1), 'circle', spec.object_circles.length - 1); }
    function addSticker() { spec.stickers.push({ id: stickerIds[0], x: 540, y: 500, rotation: 0, scale: 1 }); select(spec.stickers.at(-1), 'sticker', spec.stickers.length - 1); }
    function removeSel() {
      if (!sel.value) return; const { kind, ref: r } = sel.value;
      const map = { caption: 'captions', arrow: 'arrows', circle: 'object_circles', sticker: 'stickers' };
      const arr = spec[map[kind]]; if (arr) { const i = arr.indexOf(r); if (i >= 0) arr.splice(i, 1); }
      sel.value = null; render();
    }

    // ---- 캡션 물결 밑줄 ----
    function hasWave(c) { return (c.annotations || []).some(a => a.type === 'wavy_underline'); }
    function toggleWave(c, e) { c.annotations = c.annotations || []; if (e.target.checked) c.annotations.push({ type: 'wavy_underline', target_words: [], color: '#ffd700' }); else c.annotations = c.annotations.filter(a => a.type !== 'wavy_underline'); render(); }
    function setHashtags(e) { spec.hashtags = e.target.value.split(',').map(s => s.trim()).filter(Boolean); render(); }

    // ---- 사진 교체 / export / JSON ----
    function pickPhoto() { photoInput.value.click(); }
    function onPhoto(e) { const f = e.target.files[0]; if (!f) return; const i = new Image(); i.onload = () => { photoImg = i; render(); }; i.src = URL.createObjectURL(f); }
    function exportPNG() {
      const off = document.createElement('canvas'); off.width = W; off.height = H;
      const ctx = off.getContext('2d'); const orc = rough.canvas(off);
      const view = JSON.parse(JSON.stringify(spec));
      for (const k of ['captions', 'arrows', 'object_circles', 'stickers']) view[k] = (spec[k] || []).filter(el => !el._hidden);
      renderCard(ctx, view, { photo: photoImg, stickers: stickerImgs, rough: orc });
      off.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = currentCard.value + '_edited.png'; a.click(); });
    }
    function copyJSON() { const clean = JSON.parse(JSON.stringify(spec)); navigator.clipboard.writeText(JSON.stringify(clean, null, 2)); alert('카드 JSON을 클립보드에 복사했습니다.'); }
    function importJSON() { const t = prompt('카드 JSON 붙여넣기:'); if (!t) return; try { Object.assign(spec, JSON.parse(t)); render(); } catch (e) { alert('JSON 파싱 실패: ' + e.message); } }

    // 초기화
    (async () => {
      await loadStickers();
      await document.fonts.load('48px "Nanum Pen Script"').catch(() => {});
      await document.fonts.load('48px "Gaegu"').catch(() => {});
      await loadCard();
    })();

    return { W, H, dispW, dispH, cv, photoInput, spec, sel, selBox, currentCard, cardList: CARD_LIST, stickerIds, layers,
      render, loadCard, isSel, select, toggleHide, onDown, onMove, onUp, addCaption, addArrow, addCircle, addSticker, removeSel,
      hasWave, toggleWave, setHashtags, pickPhoto, onPhoto, exportPNG, copyJSON, importJSON };
  }
}).mount('#app');
</script>
</body>
</html>
